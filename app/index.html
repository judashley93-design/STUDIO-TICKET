<script>(()=>{const $=id=>document.getElementById(id),msg=t=>{const m=$("m");if(m)m.textContent=t};
try{const B=JSON.parse($("blob").textContent),APP="app:"+B.a;
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ",TE=new TextEncoder();
function b32e(u){let bits=0,v=0,o="";for(const x of u){v=(v<<8)|x;bits+=8;while(bits>=5){o+=B32[(v>>>(bits-5))&31];bits-=5}v&=(1<<bits)-1}if(bits>0)o+=B32[(v<<(5-bits))&31];return o}
function b32d(s){s=String(s).toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");const o=[];let bits=0,v=0;for(const c of s){const i=B32.indexOf(c);if(i<0)return null;v=(v<<5)|i;bits+=5;if(bits>=8){o.push((v>>>(bits-8))&255);bits-=8}v&=(1<<bits)-1}return Uint8Array.from(o)}
const grp=(s,n)=>s.match(new RegExp(".{1,"+(n||5)+"}","g")).join("-");
const b64e=u=>{let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
const sha=async u=>new Uint8Array(await crypto.subtle.digest("SHA-256",u));
async function hk(z,salt,info,n){const k=await crypto.subtle.importKey("raw",z,"HKDF",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"HKDF",hash:"SHA-256",salt,info},k,n*8))}
const P256=BigInt("0xffffffff00000001000000000000000000000000ffffffffffffffffffffffff"),BCOEF=BigInt("0x5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604b");
const toBig=u=>BigInt("0x"+[...u].map(x=>x.toString(16).padStart(2,"0")).join("")),fromBig=(n,l)=>Uint8Array.from(n.toString(16).padStart(l*2,"0").match(/../g).map(x=>parseInt(x,16)));
const mpow=(b,e,m)=>{let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r};
const cmp=raw=>{const o=new Uint8Array(33);o[0]=(raw[64]&1)?3:2;o.set(raw.slice(1,33),1);return o};
const dcm=c=>{const x=toBig(c.slice(1)),rhs=(((x*x%P256)*x-3n*x+BCOEF)%P256+P256)%P256;let y=mpow(rhs,(P256+1n)/4n,P256);if((y*y)%P256!==rhs)throw new Error("point");const odd=c[0]===3;if(((y&1n)===1n)!==odd)y=P256-y;const o=new Uint8Array(65);o[0]=4;o.set(fromBig(x,32),1);o.set(fromBig(y,32),33);return o};
async function mkRef(raw){const body=cat(Uint8Array.of(1),cmp(raw)),k=(await sha(body)).slice(0,2);return cat(body,k)}
async function fpr(c){return grp(b32e((await sha(c)).slice(0,5)),4)}
const actKey=async(z,appId,devC)=>hk(z,appId,cat(TE.encode("cadenas-act1"),devC),16);

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
let dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("ins").style.display="block"});$("ins").onclick=async()=>{if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null;$("ins").style.display="none"}};
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open("cadenas",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);setTimeout(()=>rej(new Error("delai")),4000)});
const kg=async k=>{try{const db=await idb();return await new Promise(res=>{const r=db.transaction("k").objectStore("k").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}catch(e){return null}};
const ks=async(k,v)=>{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const kd=async k=>{try{const db=await idb();await new Promise(res=>{const t=db.transaction("k","readwrite");t.objectStore("k").delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}};
const dec=async key=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(B.n)},key,b64d(B.c)));
const show=html=>{document.open();document.write(html);document.close()};
(async()=>{try{if(!(window.crypto&&crypto.subtle)){msg("Ce navigateur ou cette adresse ne permet pas l'activation (https requis).");return}
 const ak=await kg(APP);if(ak){try{show(await dec(ak));return}catch(e){await kd(APP)}}
 let dev=await kg("dev");if(!dev||!dev.priv){const kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);dev={priv:kp.privateKey,pub:new Uint8Array(await crypto.subtle.exportKey("raw",kp.publicKey))};await ks("dev",dev)}
 const ref=grp(b32e(await mkRef(dev.pub)),5);$("ref").textContent=ref;$("fp").textContent=await fpr(cmp(dev.pub));
 $("cp").onclick=async()=>{try{await navigator.clipboard.writeText(ref);msg("Référence copiée.");$("m").style.color="#5ddc8a"}catch(e){const r=document.createRange();r.selectNodeContents($("ref"));const s=getSelection();s.removeAllRanges();s.addRange(r);msg("Sélectionnée : copiez-la manuellement.")}};
 if(navigator.share){$("sh").style.display="block";$("sh").onclick=()=>navigator.share({title:"Référence du téléphone",text:ref}).catch(()=>{})}
 const go=async()=>{$("m").style.color="#ff8a8a";const u=b32d($("cd").value);if(!u||u.length<17){msg("Code trop court : recopiez-le en entier.");return}
  const A=u.slice(0,16);if((await sha(A))[0]!==u[16]){msg("Code mal recopié : vérifiez les caractères.");return}
  $("go").disabled=true;msg("Vérification...");
  try{const opub=await crypto.subtle.importKey("raw",b64d(B.o),{name:"ECDH",namedCurve:"P-256"},false,[]),z=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:opub},dev.priv,256)),kk=await actKey(z,b64d(B.a),cmp(dev.pub)),ck=A.map((x,i)=>x^kk[i]),key=await crypto.subtle.importKey("raw",ck,"AES-GCM",false,["decrypt"]);ck.fill(0);
   const html=await dec(key);await ks(APP,key);show(html)}
  catch(e){msg("Code incorrect pour ce téléphone.");$("go").disabled=false}};
 $("go").onclick=go;$("cd").onkeydown=e=>{if(e.key=="Enter")go()}}catch(e){msg("Erreur : "+e.message)}})()}catch(e){msg("Erreur au chargement : "+e.message)}})()</script></body></html>
